<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Temperature Converter | Raj Gupta</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="converter">

            <p class="label">OASIS INFOBYTE • LEVEL 1</p>

            <h1>Temperature Converter</h1>

            <p class="subtitle">
                Convert temperatures between Celsius, Fahrenheit and Kelvin.
            </p>


            <!-- Temperature Input -->
            <div class="form-group">

                <label for="temperature">
                    Enter Temperature
                </label>

                <input type="text" id="temperature" placeholder="Enter temperature">

            </div>


            <!-- Unit Selection -->
            <div class="form-group">

                <label for="unit">
                    Select Input Unit
                </label>

                <select id="unit">

                    <option value="C">
                        Celsius (°C)
                    </option>

                    <option value="F">
                        Fahrenheit (°F)
                    </option>

                    <option value="K">
                        Kelvin (K)
                    </option>

                </select>

            </div>


            <!-- Convert Button -->
            <button id="convertBtn">
                Convert Temperature
            </button>


            <!-- Error Message -->
            <p id="error" class="error"></p>


            <!-- Results -->
            <div id="results" class="results">

                <div class="result-card">
                    <span>Celsius</span>
                    <strong id="celsius">--</strong>
                </div>

                <div class="result-card">
                    <span>Fahrenheit</span>
                    <strong id="fahrenheit">--</strong>
                </div>

                <div class="result-card">
                    <span>Kelvin</span>
                    <strong id="kelvin">--</strong>
                </div>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
